<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Mystery Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.5.1/core.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="app-shell">
      <header class="hero">
        <p class="kicker">GitHub Pages SQL Playground</p>
        <h1>Query Your <span>database.sql</span> in the Browser</h1>
        <p class="subtitle">
          This page loads your SQL script into an in-memory SQLite engine (no backend)
          and lets you run custom queries instantly.
        </p>
      </header>

      <section class="panel controls-panel">
        <div class="controls-row">
          <button id="load-default" class="btn btn-primary">Load database.sql</button>
          <label class="btn btn-secondary file-label" for="file-input">Load .sql file</label>
          <input id="file-input" type="file" accept=".sql,text/sql" />
          <button id="reset-db" class="btn btn-ghost" disabled>Reset DB</button>
        </div>
        <p id="status" class="status">Initializing Python runtime...</p>
      </section>

      <section class="panel editor-panel">
        <div class="editor-head">
          <h2>SQL Editor</h2>
          <button id="run-query" class="btn btn-primary" disabled>Run Query</button>
        </div>
        <textarea id="query-input" spellcheck="false" aria-label="SQL query input">
SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;
        </textarea>
      </section>

      <section class="panel output-panel">
        <h2>Results</h2>
        <div id="results-meta" class="results-meta">No query executed yet.</div>
        <div id="results-wrap" class="results-wrap"></div>
      </section>
    </main>

    <script type="module" src="https://pyscript.net/releases/2025.5.1/core.js"></script>
    <script type="py" src="app.py"></script>
  </body>
</html>
